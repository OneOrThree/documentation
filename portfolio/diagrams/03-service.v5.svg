<text x="60" y="92" font-size="17" fill="#4d5a66" font-weight="400">2026.09.17 · 역할·정본·전달·운영 상태 · main 구현과 운영 활성화는 별도</text>
<rect x="40" y="120" width="1680" height="70" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
