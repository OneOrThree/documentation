<text x="64" y="244" font-size="19" fill="#334d61" font-weight="700">공개 REST</text>
<text x="64" y="271" font-size="16" fill="#4d5a66" font-weight="400">공개 계약은 Business, 코어 정본과 원자 명령은 Data가 소유한다.</text>
<rect x="40" y="818" width="1680" height="568" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="852" font-size="19" fill="#334d61" font-weight="700">실시간과 편지</text>
<text x="64" y="879" font-size="16" fill="#4d5a66" font-weight="400">Redis는 상태 사본과 fanout. 편지 정본은 PostgreSQL이다.</text>
<rect x="40" y="1434" width="1680" height="544" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="1468" font-size="19" fill="#334d61" font-weight="700">알림 · 기본 OFF</text>
<text x="64" y="1495" font-size="16" fill="#4d5a66" font-weight="400">상태 변경·receipt·outbox는 같은 TX. 중복은 eventId, 역순은 version으로 처리한다.</text>
<rect x="40" y="2026" width="1680" height="248" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="2060" font-size="19" fill="#334d61" font-weight="700">랭킹 · Target-2 · 조건 충족 후 도입</text>
<rect x="40" y="2314" width="1680" height="88" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="2348" font-size="19" fill="#334d61" font-weight="700">흐름별로 같은 서비스를 다시 표시했다. 링크·MMP는 Business/Data에 포함한다. 배치·활성화 조건은 시스템 문서를 따른다.</text>
