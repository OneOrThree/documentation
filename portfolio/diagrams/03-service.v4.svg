<title id="diagramTitle">Gromo · 서비스 아키텍처 — 명령·정본·전달</title>
<desc id="diagramDesc">2026.09.17 · main 59790ce49 대조 · 코드·활성화·설계를 구분 · 호스트 실행 상태는 미실측</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607583"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="1760" height="1590" fill="#ffffff"/>
<text x="60" y="58" font-size="32" fill="#172b3a" font-weight="700">Gromo · 서비스 아키텍처 — 명령·정본·전달</text>
<text x="60" y="92" font-size="17" fill="#4d5a66" font-weight="400">2026.09.17 · main 59790ce49 대조 · 코드·활성화·설계를 구분 · 호스트 실행 상태는 미실측</text>
<rect x="40" y="120" width="1680" height="115" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="154" font-size="19" fill="#334d61" font-weight="700">상태 범례 — 선 모양은 상태, 연결 라벨은 HTTP·Pub/Sub 등 전달 방식</text>
<text x="64" y="181" font-size="16" fill="#4d5a66" font-weight="400">실선: main 구현(운영 여부 별도)  /  긴 점선: 구현·기본 OFF  /  짧은 점선: 설계·배포 미확정</text>
<rect x="40" y="260" width="1680" height="270" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="294" font-size="19" fill="#334d61" font-weight="700">01  공개 계층과 원자 명령</text>
<text x="64" y="321" font-size="16" fill="#4d5a66" font-weight="400">Business의 독립 확장이 Data·DB 병목까지 해소하지는 않는다. 분리 비용·근거: ADR-022</text>
<rect x="40" y="550" width="800" height="540" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="584" font-size="19" fill="#334d61" font-weight="700">02  Redis의 손실 의미와 편지 정본</text>
<text x="64" y="611" font-size="16" fill="#4d5a66" font-weight="400">Data: presence 작성 / Realtime: presence 읽기·채팅 fanout. Redis는 정본이 아니다.</text>
<rect x="870" y="550" width="850" height="540" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="894" y="584" font-size="19" fill="#334d61" font-weight="700">03  알림 파이프라인 — main 구현 · 활성화 기본 OFF</text>
<text x="894" y="611" font-size="16" fill="#4d5a66" font-weight="400">PR #745는 병합됨. overlay·relay·소비·스케줄의 코드와 운영 활성화는 별도다.</text>
<rect x="40" y="1110" width="1680" height="130" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="1144" font-size="19" fill="#334d61" font-weight="700">활성화 전 기준선 · 아직 실측 결과를 주장하지 않는다</text>
<text x="64" y="1171" font-size="16" fill="#4d5a66" font-weight="400">consumer lag · DLT 유입률 · outbox oldest-pending · relay 실패율. 기준선과 중복·재처리 검증을 남긴 뒤 활성화 판단.</text>
<rect x="40" y="1260" width="1680" height="210" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="1294" font-size="19" fill="#334d61" font-weight="700">04  Target-2 — 조건 충족 후 도입 · 설계만</text>
<text x="64" y="1321" font-size="16" fill="#4d5a66" font-weight="400">리그 화면 p95 &gt; 1.5초 / findRankOf p95 &gt; 500ms / Business 다중 인스턴스 필요</text>
<rect x="40" y="1490" width="1680" height="70" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="1524" font-size="19" fill="#334d61" font-weight="700">A23: 링크·MMP 공개 표면은 Business, 원장은 Data의 gromo. 별도 Link/Vercel/Neon 서버는 폐기된 안.</text>
<path d="M 65 210 L 130 210" fill="none" stroke="#607583" stroke-width="2"/>
<text x="143" y="215" font-size="14" fill="#4d5a66" font-weight="400">main 구현 · 운영 여부 별도</text>
<path d="M 610 210 L 675 210" fill="none" stroke="#607583" stroke-width="2" stroke-dasharray="8 5"/>
<text x="688" y="215" font-size="14" fill="#4d5a66" font-weight="400">구현 · 활성화 기본 OFF</text>
