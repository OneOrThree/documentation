      flex-shrink: 0;

      gap: 12px;
    }
    button:focus-visible,

      outline-offset: 3px;
    }
    #viewport {
      height: calc(100dvh - 70px);
      min-height: 300px;
    }

      header {
        padding: 12px;
      }

        margin: 0;
      }
      nav {

        gap: 10px;
      }
    }
    header {

  <script>
    const svg = document.querySelector("#canvas svg"),
      view = document.querySelector("#viewport"),
      can = document.querySelector("#canvas");
    let zoom = 1;
    function fit() {
      zoom = Math.min(view.clientWidth / 2480, view.clientHeight / 920);
      render();
    }
    function render() {
      svg.style.width = 2480 * zoom + "px";
      svg.style.height = 920 * zoom + "px";
      can.style.width = Math.max(view.clientWidth, 2480 * zoom) + "px";
      can.style.height = Math.max(view.clientHeight, 920 * zoom) + "px";
      document.querySelector("#ratio").textContent =
        Math.round(zoom * 100) + "%";
    }
    document.querySelector("#fit").onclick = fit;
    document.querySelector("#plus").onclick = () => {
      zoom = Math.min(2, zoom * 1.25);
      render();
    };
    document.querySelector("#minus").onclick = () => {
      zoom = Math.max(0.15, zoom / 1.25);
      render();
    };
    window.addEventListener("resize", fit);
    fit();
  </script>
