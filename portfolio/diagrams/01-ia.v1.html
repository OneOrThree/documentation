    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: #292929;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Apple SD Gothic Neo",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: white;
        border: 1px solid #d4d4d4;
        border-radius: 4px;
        padding: 8px 12px;
        min-height: 36px;
      }
      button:hover {
        background: #f2f2f2;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #555;
        outline-offset: 3px;
      }
      header {
        padding: 18px 24px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px solid #ddd;
      }
      h1 {
        font-size: 18px;
        font-weight: 650;
        margin: 0;
      }
      header p {
        font-size: 11px;
        color: #777;
        margin: 4px 0 0;
      }
      .links {
        display: flex;
        gap: 14px;
        font-size: 11px;
        white-space: nowrap;
      }
      a {
        color: #555;
        text-underline-offset: 3px;
      }
      .toolbar {
        padding: 10px 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        border-bottom: 1px solid #e8e8e8;
      }
      button.active {
        background: #333;
        color: white;
        border-color: #333;
      }
      .sep {
        height: 22px;
        width: 1px;
        background: #ddd;
        margin: 0 5px;
      }
      input,
      select {
        padding: 8px 10px;
        background: #fff;
        border: 1px solid #d4d4d4;
        border-radius: 4px;
        min-height: 36px;
      }
      input {
        width: 230px;
      }
      #stage {
        max-width: 190px;
      }
      .hint {
        margin-left: auto;
        color: #888;
        font-size: 11px;
      }
      .canvas {
        position: relative;
        height: calc(100dvh - 158px);
        min-height: 450px;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
        user-select: none;
      }
      .edge {
        fill: none;
        stroke: #909090;
        stroke-width: 1.1;
      }
      .node rect {
        fill: #fff;
        stroke: #797979;
        stroke-width: 1;
        rx: 2;
      }
      .node.root rect {
        stroke: #333;
        stroke-width: 1.5;
        rx: 5;
      }
      .node text {
        fill: #333;
        font-size: 12px;
      }
      .node .sub {
        font-size: 9px;
        fill: #888;
      }
      .node {
        cursor: pointer;
      }
      .node:hover rect,
      .node:focus rect {
        fill: #f3f3f3;
        stroke: #111;
        stroke-width: 1.5;
      }
      .node.selected rect {
        fill: #ededed;
        stroke: #222;
        stroke-width: 1.8;
      }
      .node .toggle {
        font-size: 14px;
        fill: #555;
      }
      .node.locked rect {
        stroke: #b5b5b5;
        stroke-dasharray: 3 3;
      }
      .node.locked text {
        fill: #999;
      }
      .node.group .label {
        font-weight: 650;
      }
      .node.match rect {
        stroke: #000;
        stroke-width: 2;
      }
      .branch-tip {
        position: absolute;
        left: 24px;
        bottom: 14px;
        font-size: 11px;
        color: #777;
        background: #ffffffed;
        padding: 6px 10px;
        border: 1px solid #eee;
        border-radius: 4px;
        pointer-events: none;
      }
      .zoom {
        position: absolute;
        right: 24px;
        bottom: 14px;
        display: flex;
        gap: 4px;
        background: white;
      }
      .zoom button {
        min-width: 37px;
      }
      .info {
        position: absolute;
        right: 20px;
        top: 18px;
        width: 330px;
        background: #fff;
        border: 1px solid #aaa;
        border-radius: 4px;
        padding: 20px;
        max-height: calc(100% - 90px);
        overflow: auto;
        box-shadow: 0 5px 20px #0000000c;
        cursor: auto;
        user-select: text;
        touch-action: auto;
      }
      .info[hidden] {
        display: none;
      }
      .info h2 {
        font-size: 17px;
        margin: 8px 25px 12px 0;
      }
      .info h3 {
        font-size: 11px;
        color: #777;
        margin: 18px 0 5px;
        font-weight: 600;
      }
      .info p {
        margin: 5px 0;
        line-height: 1.7;
      }
      .info .close {
        position: absolute;
        right: 8px;
        top: 8px;
        border: 0;
      }
      .tag {
        font:
          11px ui-monospace,
          monospace;
        color: #777;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .chips button {
        font-size: 11px;
        padding: 4px 7px;
        min-height: 30px;
      }
      .status {
        font-size: 11px;
        color: #777;
        border-bottom: 1px solid #eee;
        padding: 7px 24px;
        height: 30px;
        display: flex;
        justify-content: space-between;
      }
      .results {
        position: absolute;
        z-index: 5;
        left: 24px;
        top: 10px;
        width: 330px;
        max-height: 70%;
        overflow: auto;
        background: white;
        border: 1px solid #aaa;
        box-shadow: 0 4px 12px #0001;
        padding: 8px;
      }
      .results[hidden] {
        display: none;
      }
      .results button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        font-size: 12px;
      }
      .results small {
        color: #888;
        display: block;
      }
      .export {
        font-size: 11px;
      }
      @media (max-width: 750px) {
        header {
          padding: 12px 14px;
          align-items: flex-start;
        }
        .links {
          display: none;
        }
        .toolbar {
          padding: 8px 12px;
          gap: 5px;
        }
        .hint {
          display: none;
        }
        input {
          width: 170px;
        }
        .canvas {
          height: calc(100dvh - 220px);
        }
        .info {
          left: 10px;
          right: 10px;
          width: auto;
          max-height: 65%;
        }
        .branch-tip {
          left: 10px;
          max-width: 55%;
        }
        .zoom {
          right: 10px;
        }
        .status {
          padding-inline: 12px;
        }
      }
      @media print {
        header,
        .toolbar,
        .status,
        .info,
        .zoom,
        .branch-tip,
        .results {
          display: none !important;
        }
        .canvas {
          height: auto;
          overflow: visible;
        }
        svg {
          height: auto;
        }
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      body > aside {
        margin: 0 !important;
        padding: 9px 20px !important;
        border: 0 !important;
        border-bottom: 1px solid #e5e8dc !important;
        font:
          11px/1.65 -apple-system,
          BlinkMacSystemFont,
          "Apple SD Gothic Neo",
          sans-serif !important;
      }
      header {
        padding: 16px 20px;
      }
      .toolbar {
        padding: 12px 20px;
      }
      .canvas {
        height: auto;
        min-height: 280px;
        flex: 1;
      }
      .status {
        flex-shrink: 0;
      }
      .toolbar button {
        border-radius: 7px;
      }
      #overview,
      #all {
        font-weight: 600;
        padding: 8px 16px;
      }
      #overview.active,
      #all.active {
        background: #33312e;
        border-color: #33312e;
      }
      .node.group {
        cursor: default;
      }
      @media (max-width: 750px) {
        body > aside {
          display: none;
        }
        .canvas {
          height: auto;
        }
        .toolbar {
          padding: 10px;
        }
        .status {
          font-size: 10px;
        }
        .status > span:last-child {
          display: none;
        }
      }
      #percent {
        display: grid;
        place-items: center;
        min-width: 48px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>

          w: Math.max(...Object.values(coords).map((c) => c.x)) + W + 40,
          h: Math.max(...Object.values(coords).map((c) => c.y)) + H + 40,
        };
        const world = $("world");
        world.replaceChildren();
        for (const n of visible) {
          const cc = children(n);
          if (!cc.length) continue;
          const p = coords[n.id];
          if (balanced && n.id === "root") {
            world.append(
              el("path", {
                d: `M${p.x + W / 2},${p.y + H}V${coords["PL-1"].y - 3}`,
                class: "edge",
                "marker-end": "url(#arrow)",
              }),
            );
            continue;
          }
          if (balanced && n.id === "PL-1") {
            const cx = p.x + W / 2;
            world.append(
              el("path", { d: `M${cx},${p.y + H}V190`, class: "edge" }),
            );
            world.append(
              el("path", {
                d: `M${columns[0].x - 30},190H${columns.at(-1).x - 30}`,
                class: "edge",
              }),
            );
            for (const col of columns) {
              const bus = col.x - 30,
                max = Math.max(...col.ids.map((id) => coords[id].y + H / 2));
              world.append(
                el("path", { d: `M${bus},190V${max}`, class: "edge" }),
              );
              for (const id of col.ids) {
                const q = coords[id];
                world.append(
                  el("path", {
                    d: `M${bus},${q.y + H / 2}H${q.x - 3}`,
                    class: "edge",
                    "marker-end": "url(#arrow)",
                  }),
                );
              }
            }
            continue;
          }
          const start = p.x + W,
            y = p.y + H / 2,
            bus = start + 35;
          world.append(
            el("path", { d: `M${start},${y}H${bus}`, class: "edge" }),
          );
          const ys = cc.map((c) => coords[c.id].y + H / 2);
          world.append(
            el("path", {
              d: `M${bus},${Math.min(y, ...ys)}V${Math.max(y, ...ys)}`,
              class: "edge",
            }),
          );
          for (const c of cc) {
            const q = coords[c.id];
            world.append(
              el("path", {
                d: `M${bus},${q.y + H / 2}H${q.x - 3}`,
                class: "edge",
                "marker-end": "url(#arrow)",
              }),
            );
          }
        }
        for (const n of visible) {
          const p = coords[n.id],
            g = el("g", {
              class:
                "node" +
                (n.group ? " group" : "") +
                (n.id === scope ? " root" : "") +
                (n.id === selected ? " selected" : ""),
              "data-id": n.id,
              transform: `translate(${p.x},${p.y})`,
              tabindex: n.group ? "-1" : "0",
              role: n.group ? "group" : "button",
              "aria-label":
                (names[n.id] || n.label) +
                (n.children.length ? " 하위 " + n.children.length + "개" : ""),
            });
          g.append(
            el(
              "title",
              {},
              (n.group ? "분류" : D.screens[n.id].kind + " · " + n.id) +
                " · " +
                n.label +
                (D.screens[n.id] ? "\n" + D.screens[n.id].purpose : ""),
            ),
          );
          g.append(el("rect", { width: W, height: H }));
          const title = names[n.id] || n.label,
            sub = gate[n.id] || (n.group ? "분류" : D.screens[n.id].kind);
          g.append(
            el(
              "text",
              {
                x: 10,
                y: 17,
                class: "label",
                "font-size": title.length > 20 ? "10" : "12",
              },
              title,
            ),
          );
          g.append(el("text", { x: 10, y: 31, class: "sub" }, sub));
          g.addEventListener("click", () => {
            if (!n.group) inspect(n.id);
          });
          g.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              if (!n.group) inspect(n.id);
            }
          });
          world.append(g);
        }
        $("overview").classList.toggle("active", mode === "overview");
        $("all").classList.toggle("active", mode === "all");
        $("overview").setAttribute("aria-pressed", mode === "overview");
        $("all").setAttribute("aria-pressed", mode === "all");
        if (fit) fitView();
        else transform();
      }
      function transform() {
        $("world").setAttribute(
          "transform",
          `translate(${tx},${ty}) scale(${scale})`,
        );
        $("percent").textContent = Math.round(scale * 100) + "%";
      }
      function fitView() {
        const r = $("canvas").getBoundingClientRect();
        scale = Math.min(
          1.35,
          (r.width - 70) / extent.w,
          (r.height - 90) / extent.h,
        );
        tx = (r.width - extent.w * scale) / 2;
        ty = Math.max(10, (r.height - extent.h * scale) / 2 - 10);
        transform();
      }
      function zoom(f, x, y) {
        const r = $("canvas").getBoundingClientRect();
        x ??= r.width / 2;
        y ??= r.height / 2;
        const next = Math.min(3, Math.max(0.12, scale * f));
        tx = x - ((x - tx) * next) / scale;
        ty = y - ((y - ty) * next) / scale;
        scale = next;
        transform();
      }
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function inspect(id) {
        if (T[id].group) return;
        selected = id;
        const s = D.screens[id];
        $("info").hidden = false;
        $("info").innerHTML =
          `<button class="close" aria-label="상세 닫기">×</button><span class="tag">${id} · ${esc(s.kind)}</span><h2>${esc(s.title)}</h2><p>${esc(s.purpose)}</p><h3>해금 조건</h3><p>${esc(D.gates[s.gate])}</p><h3>권한</h3><p>${esc(D.roles[s.role])}</p><h3>화면 상태</h3><p>${s.states.map(esc).join(" · ")}</p><h3>연결 가능한 화면 · 트리 선과 별도</h3><div class="chips">${s.next
            .filter((i) => T[i])
            .map(
              (i) =>
                `<button data-go="${i}">${i} ${esc(D.screens[i].title)}</button>`,
            )
            .join(
              "",
            )}</div>${(D.support[id] || []).length ? "<h3>이 화면에서 필요한 동작</h3>" + D.support[id].map((x) => "<p><strong>" + esc(x.title) + "</strong><br>" + esc(x.purpose) + "</p>").join("") : ""}`;
        $("info").querySelector(".close").onclick = () => {
          $("info").hidden = true;
          selected = null;
          render(false);
        };
        $("info")
          .querySelectorAll("[data-go]")
          .forEach((b) => (b.onclick = () => reveal(b.dataset.go)));
        history.replaceState(
          null,
          "",
          "#focus=" +
            encodeURIComponent(
              id === "PL-1" ? "plaza" : id.toLowerCase().replace("-", ""),
            ),
        );
        render(false);
      }
      function setMode(next) {
        mode = next;
        expanded =
          next === "all"
            ? new Set(Object.keys(T))
            : new Set(["root", "PL-1", ...T["PL-1"].children.map((n) => n.id)]);
        if (scope === "start") {
          expanded.add("start");
        }
        selected = null;
        $("info").hidden = true;
        render();
      }
      function reveal(id) {
        if (!T[id]) id = (D.supportOwners[id] || [])[0];
        if (!id) return;
        let branch = id;
        while (parent[branch]) branch = parent[branch];
        scope = branch === "start" ? "start" : "root";
        render();
        inspect(id);
        const r = $("canvas").getBoundingClientRect();
        let anchor = id;
        while (!coords[anchor] && parent[anchor]) anchor = parent[anchor];
        const c = coords[anchor];
        if (c) {
          scale = 1;
          tx = Math.max(20, (r.width - 360) / 2) - (c.x + W / 2) * scale;
          ty = r.height / 2 - (c.y + H / 2) * scale;
          transform();
        }
      }
      $("overview").onclick = () => {
        scope = "root";
        setMode("overview");
      };
      $("all").onclick = () => {
        scope = "root";
        setMode("all");
      };
      $("plus").onclick = () => zoom(1.25);
      $("minus").onclick = () => zoom(0.8);
      let drag = null;
      $("diagram").addEventListener("pointerdown", (e) => {
        if (e.target.closest(".node")) return;
        drag = { x: e.clientX, y: e.clientY, tx, ty };
        $("diagram").setPointerCapture(e.pointerId);
      });
      $("diagram").addEventListener("pointermove", (e) => {
        if (!drag) return;
        tx = drag.tx + e.clientX - drag.x;
        ty = drag.ty + e.clientY - drag.y;
        transform();
      });
      $("diagram").addEventListener("pointerup", () => (drag = null));
      $("diagram").addEventListener("pointercancel", () => (drag = null));
      $("canvas").addEventListener(
        "wheel",
        (e) => {
          if (e.target.closest(".info,.results")) return;
          e.preventDefault();
          const r = $("canvas").getBoundingClientRect();
          zoom(
            Math.exp(-e.deltaY * 0.0015),
            e.clientX - r.left,
            e.clientY - r.top,
          );
        },
        { passive: false },
      );
      window.addEventListener("resize", fitView);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          $("info").hidden = true;
        }
        if (e.target.matches("input,select")) return;
        if (e.key === "+") zoom(1.25);
        if (e.key === "-") zoom(0.8);
        if (e.key === "0") fitView();
      });
      $("export").onclick = () => {
        const svg = $("diagram").cloneNode(true);
        svg.setAttribute("xmlns", NS);
        svg.setAttribute("viewBox", `0 0 ${extent.w} ${extent.h}`);
        svg.setAttribute("width", extent.w);
        svg.setAttribute("height", extent.h);
        svg.querySelector("#world").removeAttribute("transform");
        const style = el(
          "style",
          {},
          document.querySelector("style").textContent,
        );
        svg.prepend(style);
        const blob = new Blob([new XMLSerializer().serializeToString(svg)], {
          type: "image/svg+xml",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "IA-R61-tree.svg";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      function restoreFromHash() {
        const focus = new URLSearchParams(location.hash.slice(1)).get("focus");
        if (focus) {
          const id = Object.keys(D.screens).find(
            (id) =>
              (id === "PL-1" ? "plaza" : id.toLowerCase().replace("-", "")) ===
              focus,
          );
          if (id) reveal(id);
        }
      }
      render();
      window.addEventListener("hashchange", restoreFromHash);
      restoreFromHash();
    </script>
  </body>
</html>
