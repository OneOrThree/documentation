<title id="diagramTitle">Gromo · 시스템 아키텍처 — 환경·배치·노출</title>
<desc id="diagramDesc">2026.09.17 · main 59790ce49 대조 · 코드·활성화·설계를 구분 · 호스트 실행 상태는 미실측</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607583"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="1760" height="1530" fill="#ffffff"/>
<text x="60" y="58" font-size="32" fill="#172b3a" font-weight="700">Gromo · 시스템 아키텍처 — 환경·배치·노출</text>
<text x="60" y="92" font-size="17" fill="#4d5a66" font-weight="400">2026.09.17 · main 59790ce49 대조 · 코드·활성화·설계를 구분 · 호스트 실행 상태는 미실측</text>
<rect x="40" y="120" width="1680" height="115" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="154" font-size="19" fill="#334d61" font-weight="700">상태 범례 — 선 모양은 상태, 연결 라벨은 HTTP·Pub/Sub 등 전달 방식</text>
<text x="64" y="181" font-size="16" fill="#4d5a66" font-weight="400">실선: main 구현(운영 여부 별도)  /  긴 점선: 구현·기본 OFF  /  짧은 점선: 설계·배포 미확정</text>
<rect x="40" y="260" width="1680" height="300" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="294" font-size="19" fill="#334d61" font-weight="700">01  Target-1 공개 REST 경로 — 배치 목표</text>
<text x="64" y="321" font-size="16" fill="#4d5a66" font-weight="400">목표 Business :8080 / Data :8081. 현재 dev 포트와 섞지 않는다. 호스트 전환 완료는 미확인.</text>
<rect x="40" y="580" width="800" height="470" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="614" font-size="19" fill="#334d61" font-weight="700">02  main의 dev 구성 — 코드·설정 확인</text>
<text x="64" y="641" font-size="16" fill="#4d5a66" font-weight="400">같은 PostgreSQL 컨테이너의 별도 DB. dev 공개 매핑은 prod WSS 정책의 근거가 아니다.</text>
<rect x="870" y="580" width="850" height="470" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="894" y="614" font-size="19" fill="#334d61" font-weight="700">03  prod RDS·알림 구성 — 목표와 기본 OFF</text>
<text x="894" y="641" font-size="16" fill="#4d5a66" font-weight="400">논리 DB 소유권과 물리 인스턴스를 구분한다. gromo_chat의 prod 배치는 미확정.</text>
<rect x="40" y="1070" width="1680" height="140" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="1104" font-size="19" fill="#334d61" font-weight="700">WSS 공개 노출면 — prod 라우팅은 미확정</text>
<text x="64" y="1131" font-size="16" fill="#4d5a66" font-weight="400">앱→Realtime 직행 간선을 운영 경로로 그리지 않는다. dev :8081 매핑만 코드에서 확인했다.</text>
<rect x="40" y="1230" width="1680" height="115" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="1264" font-size="19" fill="#334d61" font-weight="700">활성화·확장 조건</text>
<text x="64" y="1291" font-size="16" fill="#4d5a66" font-weight="400">Kafka: lag · DLT 유입률 · oldest-pending · relay 실패율 기준선 / 랭킹 Redis: p95 임계값 또는 다중 Business 필요</text>
<path d="M 65 210 L 130 210" fill="none" stroke="#607583" stroke-width="2"/>
<text x="143" y="215" font-size="14" fill="#4d5a66" font-weight="400">main 구현 · 운영 여부 별도</text>
<path d="M 610 210 L 675 210" fill="none" stroke="#607583" stroke-width="2" stroke-dasharray="8 5"/>
<text x="688" y="215" font-size="14" fill="#4d5a66" font-weight="400">구현 · 활성화 기본 OFF</text>
<path d="M 1160 210 L 1225 210" fill="none" stroke="#607583" stroke-width="2" stroke-dasharray="2 5"/>
<text x="1238" y="215" font-size="14" fill="#4d5a66" font-weight="400">설계 · 배포 미확정</text>
